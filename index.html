const el = (tag, cls, html) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html !== undefined) n.innerHTML = html;
  return n;
};
const esc = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

function renderList(host, items) {
  host.innerHTML = "";
  items.forEach(it => {
    const li = el("li");
    li.append(el("div", "when", esc(it.when)));
    const what = el("div", "what");
    what.append(el("div", "org", esc(it.org) + (it.now ? '<span class="badge-now">NOW</span>' : "")));
    what.append(el("div", "role", esc(it.role)));
    if (it.bullets && it.bullets.length) {
      const ul = el("ul");
      it.bullets.forEach(b => ul.append(el("li", null, esc(b))));
      what.append(ul);
    }
    li.append(what);
    host.append(li);
  });
}

function renderProjects(host, items, lab) {
  host.innerHTML = "";
  items.forEach(p => {
    const row = el("div", "proj");

    const box = el("div", "pbox");
    box.append(el("div", "pvenue", esc(p.venue)));
    box.append(el("div", "pmeta",
      `<div><span class="k">${lab.scene}</span><br>${esc(p.scene)}</div>` +
      `<div><span class="k">${lab.stack}</span><br>${esc(p.stack)}</div>`));
    row.append(box);

    const body = el("div");
    body.append(el("h3", null, esc(p.title)));
    body.append(el("div", "prole", esc(p.role)));
    body.append(el("p", "pgoal", `<strong>${lab.goal}：</strong>${esc(p.goal)}`));
    const ul = el("ul");
    p.work.forEach(w => ul.append(el("li", null, esc(w))));
    body.append(ul);
    const chips = el("div", "chips");
    p.tags.forEach(t => chips.append(el("span", "chip", esc(t))));
    body.append(chips);
    row.append(body);

    host.append(row);
  });
}

function render(lang) {
  const d = DATA[lang];
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";

  document.querySelectorAll("[data-t]").forEach(n => {
    let v = d;
    n.dataset.t.split(".").forEach(k => { v = v[k]; });
    n.innerHTML = v;
  });

  const about = document.getElementById("aboutBody");
  about.innerHTML = "";
  d.about.forEach(p => about.append(el("p", null, p)));

  const chips = document.getElementById("chips");
  chips.innerHTML = "";
  d.chips.forEach(c => chips.append(el("span", "chip", esc(c))));

  const news = document.getElementById("newsList");
  news.innerHTML = "";
  d.news.forEach(n => news.append(el("li", null, `<span class="date">${esc(n.date)}</span>${esc(n.t)}`)));

  renderList(document.getElementById("eduList"), d.education);
  renderList(document.getElementById("expList"), d.experience);
  renderProjects(document.getElementById("projList"), d.projects, LABELS[lang]);
  renderList(document.getElementById("resList"), d.research);

  const sk = document.getElementById("skillList");
  sk.innerHTML = "";
  d.skills.forEach(s => {
    const box = el("div", "skillbox");
    box.append(el("h3", null, esc(s.h)));
    const chips = el("div", "chips");
    s.t.forEach(t => chips.append(el("span", "chip", esc(t))));
    box.append(chips);
    sk.append(box);
  });

  document.getElementById("langBtn").textContent = lang === "zh" ? "EN" : "中文";
  document.title = lang === "zh" ? "苏贝贝 (Beibei Su) - 个人主页" : "Beibei Su (苏贝贝) - Homepage";
}

  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  localStorage.setItem("theme", next);
});

let lang = localStorage.getItem("lang") ||
  (navigator.language.toLowerCase().startsWith("zh") ? "zh" : "en");
document.getElementById("langBtn").addEventListener("click", () => {
  lang = lang === "zh" ? "en" : "zh";
  localStorage.setItem("lang", lang);
  render(lang);
});
